# Avaliação dos detectores de anomalias. Os dados são SINTÉTICOS.
#
# As séries são sorteadas com anomalias injetadas e distratores (coisas que parecem
# problema, mas não são). Cada injeção vira um rótulo de verdade. Os limiares do
# anomaly.yaml foram calibrados com OUTRAS sementes e outros pacientes (semente 2026,
# ids T, M e P001), então esta avaliação não repete os dados da calibração.
#
# Cuidado ao ler os números: quem gera os dados e quem mede são o mesmo projeto, então
# o resultado mostra se os detectores fazem o que foi desenhado e não o desempenho
# clínico real.

semente: 7001

# Um Finding conta como do evento se começa até tantos segundos depois do fim do rótulo
tolerancia_s:
  vitals: 120
  movement: 120
  prescription: 5

vitais:
  duracao_min: 120
  pacientes_com_eventos: 40
  pacientes_estaveis: 40          # sem anomalia, só distratores
  eventos_por_paciente: [1, 3]
  distratores_por_paciente: [1, 2]
  inicio_min: 15                  # nenhum evento antes disso
  folga_min: 12                   # mínimo entre dois eventos
  # intervalo sorteado de magnitude e duração de cada tipo
  tipos:
    dessaturacao:              {magnitude: [4, 12],     duracao_min: [2, 6],  rampa_s: 40}
    taquicardia:               {magnitude: [20, 60],    duracao_min: [3, 8],  rampa_s: 60}
    hipotensao:                {magnitude: [20, 50],    duracao_min: [3, 8],  rampa_s: 60}
    febre:                     {magnitude: [1.2, 2.5],  duracao_min: [6, 12], rampa_s: 120}
    taquipneia:                {magnitude: [8, 16],     duracao_min: [3, 8],  rampa_s: 60}
    deterioracao_multivariada: {magnitude: [0.6, 1.6],  duracao_min: [6, 14], rampa_s: 120}
  distratores:
    artefato_pico:    {magnitude: [8, 15], duracao_min: [0.2, 0.5], rampa_s: 0}
    perda_sinal:      {magnitude: [1, 1],  duracao_min: [1, 3],     rampa_s: 0}
    leitura_invalida: {magnitude: [1, 1],  duracao_min: [0.5, 2],   rampa_s: 0}
  # Sensibilidade: um evento por paciente, em cada magnitude
  varredura:
    pacientes_por_ponto: 10
    duracao_min: 90
    evento_inicio_min: 40
    magnitudes:
      dessaturacao:              [2, 4, 6, 8, 10]
      taquicardia:               [10, 20, 30, 45, 60]
      hipotensao:                [10, 20, 30, 40, 50]
      febre:                     [0.6, 1.0, 1.4, 1.8, 2.5]
      taquipneia:                [4, 8, 12, 16, 20]
      deterioracao_multivariada: [0.3, 0.6, 1.0, 1.4, 2.0]

prescricoes:
  duracao_min: 120
  pacientes: 60
  eventos_por_paciente: [4, 7]

movimento:
  pacientes_saida: 25             # saídas do leito misturadas com distratores
  pacientes_imobilidade: 15       # uma imobilidade prolongada cada
  pacientes_estaveis: 25          # só distratores
  duracao_saida_min: 300
  duracao_imobilidade_min: 420
  saidas_por_paciente: [2, 4]
  saida_duracao_s: [20, 600]
  imobilidade_duracao_min: [130, 240]   # sempre acima do limiar de 2 h
  distratores_por_paciente: [2, 5]
  folga_min: 12
